bio:
  es: |
    Soy profesor titular del Departamento de Ingeniería Electrónica y de Telecomunicaciones de la Universidad de Antioquia, donde trabajo desde 2013, e investigador del grupo GITA. Desde 2021 soy también Guest Professor de la University of Antwerp, donde dicto el curso de maestría *Future Internet*.

    Soy ingeniero de sistemas de la Universidad de Antioquia (2006) y tengo maestría (2008) y doctorado (2013) en Ingeniería Telemática de la Universitat Politècnica de Catalunya. Mi tesis doctoral, sobre algoritmos para el problema de *virtual network embedding*, recibió la mención *cum laude* y la mención internacional.

    Mi investigación trata sobre la gestión de redes programables con optimización y aprendizaje automático, con aplicaciones en ciberseguridad e infraestructura crítica, como las subestaciones eléctricas digitales y las redes eléctricas inteligentes. He dirigido siete tesis doctorales y he participado en más de quince proyectos financiados, varios de ellos con socios de Europa y América Latina.
  en: |
    I am a Full Professor in the Department of Electronic and Telecommunications Engineering at Universidad de Antioquia, where I have worked since 2013, and a researcher in the GITA group. Since 2021 I have also been a Guest Professor at the University of Antwerp, where I teach the master's course *Future Internet*.

    I received a degree in Systems Engineering from Universidad de Antioquia (2006) and an M.Sc. (2008) and a Ph.D. (2013) in Telematics Engineering from the Universitat Politècnica de Catalunya. My doctoral thesis, on algorithms for the virtual network embedding problem, was awarded *cum laude* with international mention.

    My research addresses the management of programmable networks with optimization and machine learning, with applications to cybersecurity and critical infrastructure such as digital power substations and smart grids. I have supervised seven doctoral theses and taken part in more than fifteen funded projects, several of them with partners in Europe and Latin America.


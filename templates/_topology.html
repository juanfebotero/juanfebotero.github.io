{# Network drawing on the home page. data-line ties each element to a research line id in research.yml. #}
{% set es = (lang == 'es') %}
<svg class="topo" id="topo" viewBox="0 0 560 372" role="img" aria-labelledby="topo-title topo-desc">
  <title id="topo-title">{{ 'Red programable con las líneas de investigación' if es else 'Programmable network with the research lines' }}</title>
  <desc id="topo-desc">{{ t.topo_caption }}</desc>

  <g class="plane-labels">
    <text x="10" y="22" class="t-plane">{{ 'plano de control' if es else 'control plane' }}</text>
    <line x1="10" y1="92" x2="550" y2="92" class="plane-rule"/>
    <text x="10" y="112" class="t-plane">{{ 'plano de datos' if es else 'data plane' }}</text>
  </g>

  {# control channels #}
  <g class="ctl" data-line="programmable">
    <path d="M280 58 L205 130" /><path d="M280 58 L330 140" /><path d="M280 58 L90 160" /><path d="M280 58 L460 165" /><path d="M280 58 L285 240" />
  </g>

  {# substrate links #}
  <g class="links">
    <path d="M90 160 L205 130" data-line="security"/>
    <path d="M205 130 L330 140" data-line="security"/>
    <path d="M330 140 L460 165"/>
    <path d="M90 160 L140 255" data-line="virtualization"/>
    <path d="M140 255 L285 240" data-line="virtualization"/>
    <path d="M205 130 L285 240"/>
    <path d="M330 140 L285 240"/>
    <path d="M285 240 L420 262" data-line="virtualization"/>
    <path d="M460 165 L420 262" data-line="virtualization"/>
    <path d="M330 140 L420 262"/>
    <path d="M40 74 L90 160" class="edge" data-line="security"/>
    <path d="M420 262 L506 320" class="edge" data-line="critical"/>
    <path d="M140 255 L62 326" class="edge" data-line="education"/>
  </g>

  {# virtual network embedded on the substrate (VNE) #}
  <g class="vnet" data-line="virtualization">
    <circle cx="90" cy="160" r="19"/><circle cx="285" cy="240" r="19"/><circle cx="460" cy="165" r="19"/>
  </g>

  {# packet: attack traffic crossing the network towards the P4 switch #}
  <circle class="packet" r="4.5">
    <animateMotion dur="4.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear" path="M40 74 L90 160 L205 130 L330 140"/>
  </circle>

  {# controller #}
  <g class="node ctrl" data-line="programmable">
    <rect x="236" y="26" width="88" height="32" rx="5"/>
    <text x="280" y="47" class="t-in">{{ 'Controlador' if es else 'Controller' }}</text>
  </g>

  {# switches #}
  <g class="node sw"><circle cx="90" cy="160" r="10"/></g>
  <g class="node sw" data-line="security"><circle cx="205" cy="130" r="10"/></g>
  <g class="node sw p4" data-line="programmable security"><rect x="318" y="128" width="24" height="24" rx="4"/><text x="330" y="144" class="t-in t-small">P4</text></g>
  <g class="node sw"><circle cx="460" cy="165" r="10"/></g>
  <g class="node sw" data-line="virtualization"><circle cx="140" cy="255" r="10"/></g>
  <g class="node sw"><circle cx="285" cy="240" r="10"/></g>
  <g class="node sw" data-line="virtualization"><circle cx="420" cy="262" r="10"/></g>

  {# end hosts #}
  <g class="node host" data-line="security"><rect x="30" y="64" width="20" height="20" rx="3"/></g>
  <g class="node host" data-line="critical"><rect x="496" y="310" width="20" height="20" rx="3"/></g>
  <g class="node host" data-line="education"><rect x="52" y="316" width="20" height="20" rx="3"/></g>

  {# labels #}
  <g class="labels">
    <text x="58" y="62" data-line="security">DDoS</text>
    <text x="205" y="112" text-anchor="middle" data-line="security">IDS</text>
    <text x="352" y="128" data-line="programmable">INT</text>
    <text x="150" y="285" data-line="virtualization">VNE · SFC</text>
    <text x="482" y="356" text-anchor="middle" data-line="critical">IEC 61850</text>
    <text x="80" y="362" text-anchor="middle" data-line="education">{{ 'laboratorio remoto' if es else 'remote lab' }}</text>
    <text x="336" y="20" data-line="programmable">SDN</text>
  </g>
</svg>
